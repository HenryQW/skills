<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repository survey</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212f;
      --muted: #536274;
      --line: #d7dee7;
      --page: #f5f7f9;
      --card: #fff;
      --accent: #176b57;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1080px, calc(100% - 48px));
      margin: auto;
      padding: 56px 0 80px;
    }
    header {
      max-width: 80ch;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 28px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      max-width: 24ch;
      margin-bottom: 16px;
      font-size: clamp(2.25rem, 5vw, 3.25rem);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    h2 { margin-bottom: 12px; font-size: 1.5rem; line-height: 1.25; letter-spacing: -.015em; }
    h3 { margin-bottom: 8px; font-size: 1rem; line-height: 1.4; }
    p { margin-bottom: 16px; }
    p:last-child, li:last-child { margin-bottom: 0; }
    ul { margin: 0; padding-left: 1.25rem; }
    li { margin-bottom: 6px; padding-left: 3px; }
    code {
      border-radius: 4px;
      padding: .1em .3em;
      background: #eef2f5;
      font: .875em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .eyebrow, .meta { color: var(--muted); }
    .eyebrow {
      margin-bottom: 12px;
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .summary { max-width: 68ch; font-size: 1.125rem; line-height: 1.6; }
    .meta { margin-top: 20px; font-size: .875rem; line-height: 1.55; }
    #candidates { display: grid; gap: 24px; }
    article, main > section:not(#candidates) {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 1px 2px rgb(23 33 47 / 5%);
    }
    main > article, main > section:not(#candidates) { margin-bottom: 24px; }
    .heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }
    .heading > div { min-width: 0; }
    .heading h2, .heading .rank { margin-bottom: 0; }
    .heading .rank { display: block; margin-bottom: 4px; }
    .rank { color: var(--accent); font-size: .875rem; font-weight: 750; }
    .badge {
      flex: none;
      border-radius: 999px;
      padding: 5px 10px;
      background: #e9eef3;
      color: #344255;
      font-size: .75rem;
      font-weight: 750;
      line-height: 1.4;
      white-space: nowrap;
    }
    .badge.p0 { background: #fde7e6; color: #941b1b; }
    .badge.p1 { background: #fff0c7; color: #6e4a08; }
    .compare, .details { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
    .compare { margin: 28px 0; }
    .details > * { min-width: 0; }
    .details + p { margin-top: 20px; }
    .visual {
      min-width: 0;
      border: 1px solid #e2cbc2;
      border-top: 3px solid #c96a5d;
      border-radius: 10px;
      padding: 18px;
      background: #fff8f5;
    }
    .visual.after { border-color: #b9d6cc; border-top-color: var(--accent); background: #f1f8f5; }
    .diagram-label {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .mermaid { margin: 0; overflow-x: auto; text-align: center; background: transparent; }
    .mermaid svg { display: block; max-width: 100%; height: auto; margin: auto; }
    .files {
      border-radius: 6px;
      padding: 12px 14px;
      background: #f3f6f8;
      font: .8125rem/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .evidence { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 22px; }
    @media (max-width: 820px) {
      main { width: calc(100% - 24px); padding: 32px 0 48px; }
      h1 { font-size: 2.25rem; }
      .compare, .details { grid-template-columns: 1fr; }
      .heading { display: grid; gap: 12px; }
      article, main > section:not(#candidates) { padding: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- REPORT_CONTENT_START -->
    <!-- REPORT_CONTENT_END -->
  </main>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>

</body>
</html>
