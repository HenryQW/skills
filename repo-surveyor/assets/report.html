<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repository survey</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182230;
      --muted: #5d6b7c;
      --line: #d9e0e8;
      --page: #f4f6f8;
      --card: #fff;
      --accent: #246b5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 40px));
      margin: auto;
      padding: 48px 0 72px;
    }
    header { margin-bottom: 28px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 2.5rem; line-height: 1.1; }
    h2 { font-size: 1.45rem; }
    .eyebrow, .meta, .evidence { color: var(--muted); }
    .summary { max-width: 70ch; font-size: 1.1rem; }
    #candidates { display: grid; gap: 20px; }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
    }
    .heading { display: flex; justify-content: space-between; gap: 18px; }
    .rank { color: var(--accent); font-weight: 700; }
    .badge { border-radius: 999px; padding: 5px 9px; background: #eef1f5; font-weight: 700; }
    .badge.p0 { background: #fde8e7; color: #9f1c1c; }
    .badge.p1 { background: #fff1cf; color: #76510d; }
    .compare, .details { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .compare { margin: 24px 0; }
    .visual { min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 18px; background: #fff6f1; }
    .visual.after { background: #edf7f3; border-color: #b9d6cc; }
    .diagram-label { color: var(--muted); font-weight: 700; }
    .mermaid { overflow-x: auto; text-align: center; background: transparent; }
    .mermaid svg { max-width: 100%; height: auto; }
    .files { padding: 10px 12px; background: #f6f8fa; font: 12px/1.6 monospace; overflow-wrap: anywhere; }
    .evidence { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 20px; }
    @media (max-width: 720px) {
      main { width: calc(100% - 24px); padding-top: 28px; }
      h1 { font-size: 2rem; }
      .compare, .details { grid-template-columns: 1fr; }
      .heading { display: grid; }
      article { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- REPORT_CONTENT_START -->
    <!-- REPORT_CONTENT_END -->
  </main>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: true, securityLevel: "strict" });</script>
</body>
</html>
